[theme]
base = "light"
primaryColor = "#007F73"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
maxMessageSize = 15
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
